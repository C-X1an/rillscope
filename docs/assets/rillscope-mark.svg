  </g>
  <text x="200" y="202" font-family="Arial,Helvetica,sans-serif" font-size="83" font-weight="750" letter-spacing="-4.5" fill="#f1f4e9">RillScope</text>
  <text x="204" y="245" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" fill="#bed5c3">The query is flexible. The boundary isn't.</text>
  <text x="56" y="330" font-family="Consolas,Menlo,monospace" font-size="20" letter-spacing="1" fill="#95b8a4">RESTRICTED INPUT   <tspan fill="#d3e6d5">→</tspan>   HOST-ENFORCED AUTHORITY</text>
  <path d="M765 101v187" stroke="#b2d3bd" stroke-opacity=".22"/>
  <g font-family="Arial,Helvetica,sans-serif">
