  <text x="1352" y="54" text-anchor="end" font-family="Consolas,Menlo,monospace" font-size="16" fill="#b7d7bf">RUST  /  SYSTEMS ENGINEERING</text>
  <g transform="translate(54 123)">
    <rect width="118" height="118" rx="26" fill="#1c3c33" stroke="#7bb795" stroke-opacity=".56" stroke-width="2"/>
    <path d="M24 74c17-44 29-44 45 0 15 42 24 42 40-2" fill="none" stroke="url(#mint)" stroke-width="9" stroke-linecap="round"/>
    <path d="M21 92h77" stroke="#e5bd76" stroke-width="5" stroke-linecap="round"/>
    <path d="M97 22v73" stroke="#a8d9b6" stroke-width="3.5" stroke-linecap="round"/>
