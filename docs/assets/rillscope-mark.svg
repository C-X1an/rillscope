    <circle cx="1033" cy="190" r="7" fill="#a6ddbc"/>
    <circle cx="1175" cy="190" r="7" fill="#a6ddbc"/>
    <g fill="#1a3b31" stroke="#729e86" stroke-width="2">
      <rect x="814" y="147" width="112" height="86" rx="14"/>
