<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="384" viewBox="0 0 1400 384" role="img" aria-labelledby="t d">
  <title id="t">RillScope — queries with a boundary</title>
  <desc id="d">Dark ink editorial banner. A mint geometric scope mark sits beside the RillScope wordmark, with a three-stage Bind, Scope, Verify circuit.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102723"/><stop offset=".56" stop-color="#10201e"/><stop offset="1" stop-color="#182d28"/></linearGradient>
    <linearGradient id="mint" x2="1" y2="1"><stop stop-color="#dcfae6"/><stop offset="1" stop-color="#87c9a2"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#79cc9c" stop-opacity=".15"/><stop offset="1" stop-color="#79cc9c" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b4dfc4" opacity=".10"/></pattern>
  </defs>
  <rect width="1400" height="384" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1398" height="382" rx="21" fill="none" stroke="#a6d2b5" stroke-opacity=".18" stroke-width="2"/>
  <rect x="716" y="0" width="684" height="384" fill="url(#dots)"/>
  <circle cx="1117" cy="194" r="335" fill="url(#glow)"/>
