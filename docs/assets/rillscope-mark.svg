    <text x="1018" y="180" text-anchor="middle" fill="#b9d4c2" font-size="14" letter-spacing="3">02</text>
    <text x="1018" y="210" text-anchor="middle" fill="#f0f4eb" font-size="24" font-weight="700">Scope</text>
    <text x="1194" y="180" text-anchor="middle" fill="#c5e7cd" font-size="14" letter-spacing="3">03</text>
    <text x="1194" y="210" text-anchor="middle" fill="#f0f4eb" font-size="24" font-weight="700">Verify</text>
