name: Rust product checks (reference targets separate)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make verify-reference mutation-reference
      - run: make demo-reference benchmark-reference
  rust-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make bootstrap
      - run: make build fmt lint check test verify-reference integration
      - run: make property fuzz mutation demo security
      - run: make benchmark-pilot
      - run: make benchmark-sort-null
      - run: python3 benchmarks/dispatch.py --profile cancellation-only
      - name: Retain synthetic reproducibility artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-product-evidence
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .local-runs/property-*/summary.json
            .local-runs/property-*/verdicts.jsonl
            .local-runs/fuzz-*/summary.json
            .local-runs/fuzz-*/verdicts.jsonl
            .local-runs/demo-*/report.html
            .local-runs/demo-*/manifest.json
            .local-runs/bench/p-*/grid/
            .local-runs/bench/s-*/grid/
            .local-runs/bench/c-*/cancel/
            .local-runs/build/*/build.json
            .local-runs/build/*/cargo.stdout
            .local-runs/build/*/cargo.stderr
            .local-runs/build/*/compiler.stdout
            .local-runs/build/*/compiler.stderr
            .local-runs/mutation-*/*.json
            .local-runs/mutation-*/*.stdout.txt
            .local-runs/mutation-*/*.stderr.txt
  # These are executed product contracts/campaigns on a shared Linux runner.
  # Green here does not establish the dedicated reference host or full release.
  dependency-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make bootstrap
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: make security-online
  publication-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install official Ubuntu debugger for final-decision controls
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gdb
      - run: make bootstrap build
      - run: make publication-check
      - name: Retain actual transport observations
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-boundary-observations
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          path: |
            .local-runs/publication-boundary-*/
            .local-runs/publication-decision-*/
            .local-runs/build/*/build.json
            .local-runs/build/*/compiler.stdout
            .local-runs/build/*/compiler.stderr
            .local-runs/build/*/cargo.stdout
            .local-runs/build/*/cargo.stderr
