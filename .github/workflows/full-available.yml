name: Complete available-host grid (not reference targets)
on:
  workflow_dispatch:
permissions:
  contents: read
# A later documentation/fix push must not discard a running complete capture.
concurrency:
  group: full-available-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  complete-grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make bootstrap
      - name: Execute every full-grid observation and current artifact validation
        run: python3 scripts/evidence.py --out .local-runs/full-grid-command --timeout 19800 -- python3 benchmarks/dispatch.py --profile full
      - name: Preserve the complete synthetic capture without filtering failures
        if: ${{ always() }}
        shell: python
        run: |
          import hashlib, json, tarfile
          from pathlib import Path
          grids = sorted(Path('.local-runs/bench').glob('f-*/grid'))
          if len(grids) != 1:
              raise RuntimeError('expected one actual complete or failed capture directory')
          grid = grids[0]
          paths = sorted(grid.rglob('*'))
          if len(paths) > 500000:
              raise RuntimeError('capture archive path bound exceeded')
          total = 0
          for path in paths:
              if path.is_symlink() or not (path.is_dir() or path.is_file()):
                  raise RuntimeError('capture archive requires regular owned files')
              if path.is_file(): total += path.stat().st_size
          if total > 16 * 1024**3:
              raise RuntimeError('capture archive byte bound exceeded')
          pending = Path('.local-runs/full-grid.pending.tar.xz')
          with tarfile.open(pending, 'w:xz', preset=6) as archive:
              for path in paths:
                  if path.is_file():
                      archive.add(path, arcname=path.relative_to(grid.parent.parent).as_posix(), recursive=False)
          size = pending.stat().st_size
          archive_digest = hashlib.sha256()
          with pending.open('rb') as stream:
              while block := stream.read(1024 * 1024):
                  archive_digest.update(block)
          result = {'status':'RECORDED', 'files':sum(path.is_file() for path in paths),
                    'uncompressed_bytes':total, 'compressed_bytes':size,
                    'archive_sha256':archive_digest.hexdigest(),
                    'scope':'all actual grid files, including every failure; no dedicated reference-host or release claim'}
          if size > 100 * 1024**2:
              result['status'] = 'BLOCKED'
              result['reason'] = 'conservative transient artifact storage bound exceeded; full capture not exported'
          else:
              pending.rename('.local-runs/full-grid.tar.xz')
          Path('.local-runs/full-grid-archive.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          if result['status'] == 'BLOCKED': raise SystemExit(77)
      - name: Retain actual full-grid evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complete-available-host-grid
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .local-runs/full-grid-command/
            .local-runs/full-grid-archive.json
            .local-runs/full-grid.tar.xz
