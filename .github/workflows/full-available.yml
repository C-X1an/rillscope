name: Complete available-host grid (not reference targets)
on:
  workflow_dispatch:
permissions:
  contents: read
# A later documentation/fix push must not discard a running complete capture.
concurrency:
  group: full-available-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  complete-grid:
    runs-on: ubuntu-24.04
    # Step maxima: 5+10+312+22+5=354min, leaving6min for job finalization.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - run: make bootstrap
        timeout-minutes: 10
      - name: Execute every full-grid observation and current artifact validation
        timeout-minutes: 312
        run: python3 scripts/evidence.py --out .local-runs/full-grid-command --timeout 18600 -- python3 benchmarks/dispatch.py --profile full
      - name: Preserve the complete synthetic capture without filtering failures
        if: ${{ always() }}
        timeout-minutes: 22
        shell: python
        run: |
          import subprocess, sys
          from pathlib import Path
          grids = sorted(Path('.local-runs/bench').glob('f-*/grid'))
          if len(grids) != 1:
              raise RuntimeError('expected one actual complete or failed capture directory')
          raise SystemExit(subprocess.call([sys.executable,'scripts/evidence.py',
              '--out','.local-runs/full-grid-pack-command','--timeout','1200','--',
              sys.executable,'scripts/archive_capture.py','pack','--source',str(grids[0]),
              '--out','.local-runs/full-grid-package']))
      - name: Retain actual full-grid evidence
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complete-available-host-grid
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .local-runs/full-grid-command/
            .local-runs/full-grid-pack-command/
            .local-runs/full-grid-package/archive-result.json
            .local-runs/full-grid-package/capture.zip
